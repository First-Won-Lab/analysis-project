<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>analysis.js 테스트</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; margin: 24px 16px; background: #fcfcfb; color: #0b0b0b; }
    .pass { color: #008300; } .fail { color: #c62828; font-weight: 700; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>analysis.js 테스트</h1>
  <p>로컬 서버로 열어야 합니다 (예: 저장소 루트에서 <code>python -m http.server</code> 후
    <code>http://localhost:8000/tests/analysis.test.html</code>). 케이스는 <code>tests/cases.json</code>을 Python 테스트와 함께 씁니다.</p>
  <h2 id="summary">실행 중…</h2>
  <pre id="log"></pre>
  <script src="../assets/analysis.js"></script>
  <script>
  (async () => {
    const A = window.Analysis;
    const C = await (await fetch('cases.json')).json();
    const log = document.getElementById('log');
    let pass = 0, fail = 0;
    const eq = (x, y) => JSON.stringify(x) === JSON.stringify(y);
    function t(name, ok, detail) {
      ok ? pass++ : fail++;
      const line = document.createElement('div');
      line.className = ok ? 'pass' : 'fail';
      line.textContent = `${ok ? '✔' : '✘'} ${name}${ok ? '' : '  → ' + detail}`;
      log.appendChild(line);
    }

    for (const c of C.file_names) {
      const got = A.parseFileName(c.name);
      t(`파일명 ${c.name}`, eq(got, c.expect), JSON.stringify(got));
    }
    for (const c of C.pair_checks) {
      const got = A.checkPair(c.a, c.b);
      const ok = c.ok ? got.ok && got.neutral === c.neutral : !got.ok && got.errors.length > 0;
      t(`쌍 확인 ${c.a} + ${c.b}`, ok, JSON.stringify(got));
    }
    C.csv_peaks.forEach((c, i) => {
      const p = A.parseCsv(c.text).peak;
      const got = p && { hz: p.hz, db: p.db };
      t(`피크 추출 #${i}`, eq(got, c.expect), JSON.stringify(got));
    });
    const r = A.buildPairs(C.pairing.names);
    t('쌍 구성', eq(r.pairs.map((p) => [p.expr, p.part, p.attempt]), C.pairing.expect_pairs), JSON.stringify(r.pairs));
    t('짝 없음', eq([...r.unpaired].sort(), [...C.pairing.expect_unpaired].sort()), JSON.stringify(r.unpaired));
    t('규칙 불일치', eq(r.unrecognized, C.pairing.expect_unrecognized), JSON.stringify(r.unrecognized));
    const M = C.attempt_matrix;
    const m = A.attemptMatrix(M.results, M.unpaired);
    t('attempt 합집합', eq(m.attempts, M.expect_attempts), JSON.stringify(m.attempts));
    const mg = m.groups.map((g) => [g.expr, g.part, g.rows.map((r) => [r.attempt, r.result ? 'pair' : 'unpaired'])]);
    t('비교군 × attempt 표', eq(mg, M.expect_groups), JSON.stringify(mg));
    // ----- 분석 정의 v2 -----
    const FD = C.v2_find_dips;
    for (const c of FD.cases) {
      const got = A.findDips({ db: FD.db }, c.min_prominence).map((d) => [d.index, d.prominence]);
      t(`dip 검출 (최소 돌출도 ${c.min_prominence})`, eq(got, c.expect), JSON.stringify(got));
    }
    const PB = C.v2_parabolic;
    const pm = A.parabolicMin({ freq: PB.freq, db: PB.db }, PB.index);
    t('포물선 보간', Math.abs(pm.hz - PB.expect.hz) < 1e-9 && Math.abs(pm.db - PB.expect.db) < 1e-9, JSON.stringify(pm));
    const SY = C.v2_synthetic;
    const synth = (dips) => {
      const freq = [];
      const db = [];
      for (let i = 0; i < SY.n; i++) {
        const f = SY.start + i * SY.step;
        freq.push(f);
        db.push(SY.base - dips.reduce((acc, d) => acc + d.depth * Math.exp(-(((f - d.center) / d.width) ** 2)), 0));
      }
      return { freq, db };
    };
    const rows = A.compareBands(synth(SY.neutral), synth(SY.expressive), {});
    SY.expect.forEach((exp, i) => {
      const r = rows[i];
      let ok = r.band === exp.band && r.status === exp.status;
      if (ok && exp.status !== 'missing') {
        ok = Math.abs(r.shiftMin - exp.shift_min) <= SY.tol_hz && Math.abs(r.shiftShape - exp.shift_shape) <= SY.tol_hz &&
          Math.abs(r.depthDiff - exp.depth_diff) <= SY.tol_db && !r.shapeChanged;
      }
      t(`합성 곡선 ${exp.band}`, ok, JSON.stringify({ status: r.status, shiftMin: r.shiftMin, shiftShape: r.shiftShape, depthDiff: r.depthDiff }));
    });
    t('평균', Math.abs(A.mean(C.stats.values) - C.stats.mean) < 1e-12, A.mean(C.stats.values));
    t('표본표준편차', Math.abs(A.stdev(C.stats.values) - C.stats.stdev) < 1e-12, A.stdev(C.stats.values));
    t('표본 1개 SD = null', A.stdev([5]) === null, A.stdev([5]));

    const s = document.getElementById('summary');
    s.textContent = fail ? `실패 ${fail}개 / 통과 ${pass}개` : `모두 통과 (${pass}개)`;
    s.className = fail ? 'fail' : 'pass';
    document.title = fail ? 'FAIL' : 'PASS';
  })();
  </script>
</body>
</html>
